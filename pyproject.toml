[project]
name = "wyoming-stt-api"
version = "2.1.0"
description = "Wyoming server running speech-to-text with API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.101.0",
    "pydantic-settings>=2.10.1",
    "wyoming>=1.7.2",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.10",
]

[tool.ruff]
lint.extend-select = ["I"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
